<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Click2hedge</title>
  <link rel="stylesheet" href="styles.css">
  </head>
<body>
  <header class="site-header"><div class="container"><a class="logo" href="index.html"><img src="assets/logo.svg" alt="Click2hedge logo" height="36"></a><nav class="nav"><a href="index.html">Home</a><a href="onboarding.html">Onboarding</a><a href="financial_plan.html">Financial Plan</a><a href="itr_filing.html">ITR Filing</a><a href="portfolio_monitoring.html">Portfolio</a><a href="contact.html">Contact</a></nav></div></header>
  <main class="container contact">
    <h1>Contact & Bookings</h1>
    <p>Use the form below to reach us. For sensitive documents, we'll provide secure upload after initial contact.</p>
    <form id="contactForm">
      <label>Name<input name="name" required></label>
      <label>Email<input name="email" type="email" required></label>
      <label>Phone<input name="phone" type="tel"></label>
      <label>Service
        <select name="service">
          <option>Financial Planning</option>
          <option>ITR Filing</option>
          <option>Investment Advisory</option>
          <option>Portfolio Monitoring</option>
        </select>
      </label>
      <label>Message<textarea name="message" rows="4" required></textarea></label>
      <button type="submit" class="btn-primary">Send Inquiry</button>
    </form>
    <p class="small">Or email: hello@click2hedge.example</p>
  </main>
  <footer class="site-footer"><div class="container">© Click2hedge</div></footer>
  <script src="script.js"></script>
</body>
</html>
